<div class="dashboard-wrapper">
  <app-sidebar-admin></app-sidebar-admin>

  <main class="main-viewport">
    <app-header-admin></app-header-admin>

    <div class="dashboard-card">
      <div class="card-header-flex">
        <h3>Usuarios Registrados</h3>
        <button class="btn-create-pqrs">
          <i class="material-icons">person_add</i>
          Nuevo Usuario
        </button>
      </div>

      <div *ngIf="loadingUsuarios" class="loading-container">
        <div class="preloader-wrapper big active">
          <div class="spinner-layer spinner-green-only">
            <div class="circle-clipper left"><div class="circle"></div></div>
            <div class="gap-patch"><div class="circle"></div></div>
            <div class="circle-clipper right"><div class="circle"></div></div>
          </div>
        </div>
        <p style="margin-top: 20px; color: #64748B;">Cargando usuarios...</p>
      </div>

      <div *ngIf="!loadingUsuarios && usuariosList.length === 0" class="empty-state">
        <i class="material-icons empty-icon">people</i>
        <h4>No hay usuarios registrados</h4>
      </div>

      <div *ngIf="!loadingUsuarios && usuariosList.length > 0" class="usuarios-grid">
        <div class="usuario-card" *ngFor="let usuario of usuariosList">
          <div class="usuario-avatar">
            <img [src]="usuario.foto || 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjOTk5IiBzdHJva2Utd2lkdGg9IjIiPjxjaXJjbGUgY3g9IjEyIiBjeT0iOCIgcj0iNCIvPjxwYXRoIGQ9Ik0yMCAyMGMtMiAxLTUgMi04IDItMCAzLTUgNS04IDUtMiAzLTUgNS04IDV6Ii8+PC9zdmc+'" alt="Avatar">
          </div>
          <div class="usuario-info">
            <h4>{{ usuario.nombre }}</h4>
            <p>{{ usuario.email }}</p>
            <div class="usuario-meta">
              <span class="chip">{{ usuario.tipoUsuario }}</span>
              <span class="chip">{{ usuario.tipoResidente }}</span>
            </div>
            <p class="usuario-ubicacion">Bloque {{ usuario.numeroBloque }} - Apto {{ usuario.numeroApartamento }}</p>
          </div>
          <div class="usuario-actions">
            <button class="btn-action btn-edit" title="Editar">
              <i class="material-icons">edit</i>
            </button>
            <button class="btn-action btn-delete" title="Eliminar">
              <i class="material-icons">delete</i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
